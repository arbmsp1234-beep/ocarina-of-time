
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocarina of Time | Game Terminal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101510;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 22px 12px;
      background: #1b2b1b;
      border-bottom: 2px solid #65844b;
    }

    h1 {
      color: #d6e8a5;
      font-size: clamp(20px, 4vw, 28px);
      margin: 0;
    }

    #setup {
      padding: 24px 12px;
    }

    #choose {
      display: inline-block;
      padding: 13px 20px;
      background: #668747;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    #status {
      margin: 16px;
      color: #d6e8a5;
      overflow-wrap: anywhere;
    }

    #game {
      width: 96%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      margin: 0 auto 20px;
      background: black;
      overflow: hidden;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .note {
      padding: 0 18px 24px;
      color: #bbc6b9;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>The Legend of Zelda: Ocarina of Time</h1>
    <p>GAME TERMINAL</p>
  </header>

  <section id="setup">
    <p>Select your legally obtained Nintendo 64 game file.</p>

    <input
      id="rom"
      type="file"
      accept=".z64,.n64,.v64"
      hidden
    >

    <button id="choose" type="button">
      Choose ROM File
    </button>

    <div id="status" role="status">
      Waiting for your game file.
    </div>
  </section>

  <div id="game"></div>

  <div class="note">
    Your ROM is loaded from your own device and is not uploaded
    to this website. The emulator itself loads from the EmulatorJS CDN.
  </div>

  <script>
    const romInput = document.getElementById("rom");
    const chooseButton = document.getElementById("choose");
    const statusBox = document.getElementById("status");

    let started = false;

    chooseButton.addEventListener("click", function () {
      romInput.click();
    });

    romInput.addEventListener("change", function () {
      const file = romInput.files[0];

      if (!file) return;

      if (started) {
        statusBox.textContent =
          "Refresh the page to choose a different game file.";
        return;
      }

      const validName = /\.(z64|n64|v64)$/i.test(file.name);

      if (!validName) {
        statusBox.textContent =
          "Please select a .z64, .n64, or .v64 game file.";
        return;
      }

      started = true;
      chooseButton.disabled = true;
      chooseButton.textContent = "Loading Game…";

      statusBox.textContent =
        "Loading " + file.name + "…";

      // Create a local browser URL for the selected file.
      const localRomUrl = URL.createObjectURL(file);

      window.EJS_player = "#game";
      window.EJS_core = "n64";
      window.EJS_gameName =
        "The Legend of Zelda: Ocarina of Time";
      window.EJS_gameUrl = localRomUrl;
      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/latest/data/";
      window.EJS_startOnLoaded = true;

      const loader = document.createElement("script");
      loader.src = window.EJS_pathtodata + "loader.js";

      loader.onload = function () {
        statusBox.textContent =
          "Emulator loaded. Preparing your game…";
      };

      loader.onerror = function () {
        statusBox.textContent =
          "Could not load EmulatorJS. Try opening this page in Safari.";
        chooseButton.disabled = false;
        chooseButton.textContent = "Choose ROM File";
        started = false;
        URL.revokeObjectURL(localRomUrl);
      };

      document.body.appendChild(loader);
    });
  </script>
</body>
</html>
