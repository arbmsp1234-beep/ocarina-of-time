
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocarina of Time | Game Terminal</title>

  <style>
    body {
      margin: 0;
      background: #101510;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #1b2b1b;
      border-bottom: 2px solid #65844b;
    }

    h1 {
      color: #d6e8a5;
      font-size: 24px;
    }

    #status {
      padding: 12px;
      color: #d6e8a5;
    }

    #game {
      width: 95%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      margin: 15px auto;
      background: black;
      overflow: hidden;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>

<body>
  <header>
    <h1>The Legend of Zelda: Ocarina of Time</h1>
    <p>GAME TERMINAL</p>
  </header>

  <div id="status">Loading emulator…</div>
  <div id="game"></div>

  <script>
    var EJS_player = "#game";
    var EJS_core = "n64";
    var EJS_gameName = "The Legend of Zelda: Ocarina of Time";

    var EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    var EJS_gameUrl =
      "https://drive.google.com/uc?export=download&id=1c-i9r8wbvB7RXv0--XlGTGo3xKbmchbV";

    var EJS_startOnLoaded = true;

    var script = document.createElement("script");
    script.src = EJS_pathtodata + "loader.js";

    script.onload = function () {
      document.getElementById("status").textContent =
        "Emulator loader downloaded. Starting game…";
    };

    script.onerror = function () {
      document.getElementById("status").textContent =
        "ERROR: Emulator loader could not be downloaded.";
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
