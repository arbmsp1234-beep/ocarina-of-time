
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocarina of Time</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "n64";
    window.EJS_gameName = "The Legend of Zelda: Ocarina of Time";

    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/latest/data/";

    window.EJS_startOnLoaded = true;

    // Let EmulatorJS ask you to select your ROM file.
    window.EJS_gameUrl = "";

    const loader = document.createElement("script");
    loader.src = window.EJS_pathtodata + "loader.js";
    document.body.appendChild(loader);
  </script>
</body>
</html>
